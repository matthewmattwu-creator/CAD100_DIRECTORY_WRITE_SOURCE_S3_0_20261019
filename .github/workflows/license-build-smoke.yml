name: License build smoke test

on:
  push:
    branches:
      - feature/license-system-v2
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production public key
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\tmp\release-key -Force | Out-Null
          $publicKey = @'
          <RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'tmp\release-key\public_key.xml'), $publicKey.Trim(), (New-Object System.Text.UTF8Encoding($false)))

      - name: Build production authorized application
        shell: powershell
        run: >-
          .\build.ps1
          -LicenseApiBaseUrl "https://auth.viewonly.cloud"
          -LicensePublicKeyPath ".\tmp\release-key\public_key.xml"

      - name: Verify outputs
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\CAD-100\CAD-100.exe)) { throw "CAD-100.exe missing" }
          if (-not (Test-Path .\dist\CAD-100\CadProcessingCore.dll)) { throw "CadProcessingCore.dll missing" }
          if (-not (Test-Path .\dist\CAD-100\CAD-100.exe.config)) { throw "CAD-100.exe.config missing" }
          Write-Host "Production authorized build passed."

      - name: Upload ready-to-use package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CAD-100-authorized
          path: .\dist\CAD-100\
          if-no-files-found: error
          retention-days: 14
